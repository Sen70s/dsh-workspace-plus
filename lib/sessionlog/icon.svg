    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0f1420"/>
  <path d="M18 11h18l10 10v32a2 2 0 0 1-2 2H18a2 2 0 0 1-2-2V13a2 2 0 0 1 2-2Z" fill="url(#page)"/>
  <path d="M36 11v8a2 2 0 0 0 2 2h8Z" fill="#8fb6ff"/>
  <g fill="#0f1420" opacity=".62">
    <rect x="21" y="26" width="16" height="2.6" rx="1.3"/>
    <rect x="21" y="32" width="22" height="2.6" rx="1.3"/>
    <rect x="21" y="38" width="12" height="2.6" rx="1.3"/>
  </g>
  <path d="M43 41.5h9.5m0 0-4-4m4 4-4 4" stroke="#39d98a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
