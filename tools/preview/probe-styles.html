<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>probe-styles</title>
    <!-- Exactly index.html plus probe-styles.js, so the values it reports are the
         ones the screenshots are made from. Any `?flag` index.html understands
         works here too. -->
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./vendor.css" />
    <link rel="stylesheet" href="./shell.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1b1c;
      }
      *,
      *::before,
      *::after {
        animation: none !important;
      }
      .backdrop {
        position: fixed;
        inset: 0;
        padding: 24px 28px;
        color: #61666b;
        font: 14px/1.9 system-ui, "Segoe UI", sans-serif;
      }
    </style>
  </head>
  <body data-ds-dark-theme>
    <div class="backdrop">
      <p>wanderisland</p>
      <p>apps/web · api · docs · admin-ui</p>
    </div>
    <div id="root"></div>
    <script src="./react.development.js"></script>
    <script src="./react-dom.development.js"></script>
    <script src="./harness.js"></script>
    <script src="./client.js"></script>
    <script src="./boot.js"></script>
    <script src="./probe-styles.js"></script>
  </body>
</html>
